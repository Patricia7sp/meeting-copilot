# Copie para settings.yaml e ajuste
app:
  mode: auto            # english | work | auto
  language_hint: "pt+en"
  cooldown_seconds: 10  # anti-spam: max 1 insight a cada N seg
  max_window_turns: 12
  persist_sessions: true
  data_dir: "./data/sessions"

router:
  # regras locais primeiro; LLM pequeno só na Entrega 3
  min_words_to_consider: 4
  filler_words: ["uhm", "ahn", "é...", "tipo", "hmm", "uh", "ah"]

llm:
  provider: none        # none | openrouter | gemini | openai | groq | ollama
  # OpenRouter (recomendado: leque de modelos + frees com fallback automático)
  # export OPENROUTER_API_KEY="sk-or-..."  (nunca commitar)
  # export OPENROUTER_MODEL="meta-llama/llama-3.3-70b-instruct:free"
  # export OPENROUTER_FALLBACKS="google/gemma-3-27b-it:free,qwen/qwen3-32b:free"
  model: "meta-llama/llama-3.3-70b-instruct:free"
  api_key_env: "OPENROUTER_API_KEY"
  timeout_seconds: 12
  # Sem chave: usa templates locais (funciona offline)

privacy:
  save_audio: false
  save_transcript: true
  show_recording_indicator: true
