services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - ORCHESTRATOR_MODE=auto
      - LLM_PROVIDER=${LLM_PROVIDER:-none}  # none | openrouter | gemini | openai | groq | ollama
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - OPENROUTER_FALLBACKS=${OPENROUTER_FALLBACKS:-google/gemma-3-27b-it:free,qwen/qwen3-32b:free}
      - OPENROUTER_TIMEOUT=${OPENROUTER_TIMEOUT:-12}
    depends_on:
      - qdrant
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # STT roda melhor nativo (acesso a PipeWire/WASAPI), mas deixamos imagem pronta
  stt:
    build: ./apps/stt
    environment:
      - WHISPER_MODEL=large-v3-turbo
      - API_WS_URL=ws://api:8000/ws
      - MOCK_MODE=true
    volumes:
      - ./data:/app/data
    profiles: ["full"]  # sobe só com: docker compose --profile full up

  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.5.11
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["full"]

volumes:
  qdrant_data:
  ollama_data:
